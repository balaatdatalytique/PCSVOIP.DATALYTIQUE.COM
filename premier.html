	<style>
        body {

        /* Chatbox styles */
        
    /* Chatbot icon and window style */
    

    #chatbot-icon {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background-color: #25D366; /* WhatsApp green instead of navy blue */
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 28px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); /* Updated shadow color */
        transition: all 0.3s ease;
        z-index: 1000;
    }

    #chatbot-icon:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); /* Updated shadow color */
    }

    #chatbot-window {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 380px;
        height: 600px;
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        border: none;
        z-index: 1000;
        overflow: hidden;
    }

    #chatbot-header {
        background: linear-gradient(135deg, #25D366, #128C7E); /* WhatsApp green gradient */
        color: white;
        padding: 15px 20px;
        border-radius: 15px 15px 0 0;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #chatbot-header .close-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 5px;
        transition: background 0.3s ease;
    }

    #chatbot-header .close-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    #chatbot-body {
        padding: 20px;
        flex-grow: 1;
        overflow-y: auto;
        background-color: #f0f2f5;
    }

    .topic-item {
        padding: 12px 15px;
        margin: 8px 0;
        background: white;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        border-left: 4px solid #25D366; /* WhatsApp green instead of navy blue */
    }

    .topic-item:hover {
        background: #f8f9fa;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .user-form {
        display: none;
        padding: 15px;
        background: white;
        border-radius: 10px;
        margin-top: 10px;
    }

    .user-form input, #chatbot-input {
        width: calc(100% - 24px);
        margin: 8px 0;
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .user-form input:focus, #chatbot-input:focus {
        border-color: #25D366; /* WhatsApp green instead of navy blue */
        outline: none;
    }

    .user-form button {
        width: 100%;
        padding: 12px;
        background: #25D366; /* WhatsApp green instead of navy blue */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
        margin-top: 10px;
    }

    .user-form button:hover {
        background: #128C7E; /* Darker WhatsApp green */
    }

    .message {
        margin: 12px 0;
        padding: 12px 15px;
        border-radius: 15px;
        max-width: 80%;
        font-size: 14px;
        line-height: 1.4;
    }

    .user-message {
        background: #e3f2fd; /* Light blue background for user messages */
        margin-left: auto;
        border-bottom-right-radius: 5px;
    }

    .bot-message {
        background: white;
        margin-right: auto;
        border-bottom-left-radius: 5px;
    }

    #chatbot-footer {
        padding: 15px;
        background: white;
        border-top: 1px solid #eee;
    }

    #chatbot-input {
        border-radius: 25px;
        background: #f0f2f5;
    }

    #welcome-message p {
        color: #666;
        font-size: 15px;
        margin-bottom: 15px;
        text-align: center;
    }

    .chatbot-overlay {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
        transition: all 0.3s ease;
    }

    /* Custom scrollbar */
    #chatbot-body::-webkit-scrollbar {
        width: 6px;
    }

    #chatbot-body::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    #chatbot-body::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
    }

    #chatbot-body::-webkit-scrollbar-thumb:hover {
        background: #555;
    }

    .header-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .header-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 5px;
        transition: background 0.3s ease;
    }

    .phone-btn {
        padding: 5px 8px;
    }

    .header-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    </style>

<body>

		     <div id="chatbot-icon" onclick="toggleChatbot()">
        <i class="fas fa-comments"></i>
    </div>

    <!-- Add overlay div -->
    <div class="chatbot-overlay" id="chatbot-overlay"></div>

    <!-- Chatbot Window -->
    <div id="chatbot-window">
        <div id="chatbot-header">
            <span>Chat with Us</span>
            <div class="header-buttons">
                <button class="header-btn phone-btn" onclick="initiateCall()">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="close-btn" onclick="closeChatbot()">End Chat</button>
            </div>
        </div>
        <div id="chatbot-body">
            <div id="chat-messages"></div>
            <div id="user-form" class="user-form">
                <input type="text" id="user-first-name" placeholder="First Name *" required>
                <input type="text" id="user-last-name" placeholder="Last Name *" required>
                <input type="tel" id="user-phone" placeholder="Phone Number *" required>
                <input type="email" id="user-email" placeholder="Email (optional)">
                <button onclick="startChat()">Start Chat</button>
            </div>
        </div>
        <div id="chatbot-footer">
            <input type="text" id="chatbot-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" disabled>
        </div>
    </div>        
</body>
<script>
    let currentSessionId = null;
let selectedTopic = null;
let currentUserInfo = null;
let topic_id = null;
let user_id = "858f87b5-aed1-11ef-89c7-f04da27469f1";
let chat_id = 'a07951f1-47e3-48f7-a4d5-4e268b9a6a50';
// Add this at the top with other variables
const GREETING_MESSAGE = "👋 Hello! I'm your virtual assistant from PCS VOIP. To get started, please provide your information below.";

// Modify existing toggleChatbot function
function toggleChatbot() {
    const chatbotWindow = document.getElementById('chatbot-window');
    const chatbotIcon = document.getElementById('chatbot-icon');
    const overlay = document.getElementById('chatbot-overlay');
    
    // Debug log
    console.log('Toggle clicked', chatbotWindow.style.display);

    loadTopic();
    if (chatbotWindow.style.display === 'none' || !chatbotWindow.style.display) {
        chatbotWindow.style.display = 'flex';
        overlay.style.display = 'block';
        chatbotIcon.style.width = '40px';
        chatbotIcon.style.height = '40px';
        if (currentUserInfo) {
            // If we already have user info, start chat immediately
            document.getElementById('user-form').style.display = 'none';
            document.getElementById('chat-messages').style.display = 'block';
            document.getElementById('chatbot-footer').style.display = 'block';
            document.getElementById('chatbot-input').disabled = false;
           
        } else {
            // Show the greeting message and form
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = `<div class="message bot-message">${GREETING_MESSAGE}</div>`;
            chatMessages.style.display = 'block';
            document.getElementById('user-form').style.display = 'block';
        }
    } else {
        chatbotWindow.style.display = 'none';
        overlay.style.display = 'none';
        chatbotIcon.style.width = '50px';
        chatbotIcon.style.height = '50px';
      //  resetChat();
    }
}



async function startChat() {
    const firstName = document.getElementById('user-first-name').value.trim();
    const lastName = document.getElementById('user-last-name').value.trim();
    const userPhone = document.getElementById('user-phone').value.trim();
    const userEmail = document.getElementById('user-email').value.trim();

    // Validate mandatory fields
    if (!firstName || !lastName || !userPhone) {
        alert('Please fill in all required fields (First Name, Last Name, and Phone Number)');
        return;
    }

    // Validate phone number format
    const phoneRegex = /^\d{10}$/;
    if (!phoneRegex.test(userPhone.replace(/[-\s]/g, ''))) {
        alert('Please enter a valid phone number');
        return;
    }

    // Store user info
    currentUserInfo = { firstName, lastName, userPhone, userEmail };

    document.getElementById('user-form').style.display = 'none';
    document.getElementById('chat-messages').style.display = 'block';
    document.getElementById('chatbot-footer').style.display = 'block';
	
    // Enable the message input box
    document.getElementById('chatbot-input').disabled = false;
 // Add the "How can I assist you today?" message
 const chatMessages = document.getElementById('chat-messages');
	sendMessage("Hi");
    //chatMessages.innerHTML = `
    //    <div class="message bot-message">How can I assist you today?</div>
    //`;

}

async function sendMessage(message, userInfo = null) {
    const chatMessages = document.getElementById('chat-messages');
    if (currentSessionId === null){
	chatMessages.innerHTML = '';
	}
	else{
	// Add user message to chat
    chatMessages.innerHTML += `
        <div class="message user-message">${message}</div>
    `;
	}
    
    // Scroll the last message into view
    const messages = chatMessages.getElementsByClassName('message');
    if (messages.length > 0) {
        messages[messages.length - 1].scrollIntoView({ behavior: 'smooth' });
    }

    const requestBody = {
        session_id: currentSessionId,
        topic_id: topic_id,
        message: message,
        user_id: user_id,
        first_name: userInfo?.firstName || '',
        last_name: userInfo?.lastName || '',
        phone: userInfo?.userPhone || '',
        email: userInfo?.userEmail || ''
    };

    try {
        const response = await fetch('https://teleapi.datalytique.com:7755/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
        });
        const data = await response.json();
        
        currentSessionId = data.session_id;
        
        // Add bot response to chat
        chatMessages.innerHTML += `
            <div class="message bot-message">${data.message}</div>
        `;
        
        // Scroll the bot message into view
        const updatedMessages = chatMessages.getElementsByClassName('message');
        if (updatedMessages.length > 0) {
            updatedMessages[updatedMessages.length - 1].scrollIntoView({ behavior: 'smooth' });
        }
    } catch (error) {
        console.error('Error sending message:', error);
    }
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        const input = document.getElementById('chatbot-input');
        const message = input.value.trim();
        if (message) {
			if (currentSessionId === null)
			{
				sendMessage(message,currentUserInfo);
			}
			else{
			 sendMessage(message);
			}
           
            input.value = '';
        }
    }
}

function resetChat() {
    // Reset chat-specific variables
    currentSessionId = null;
    selectedTopic = null;

    // Reset UI elements
    document.getElementById('user-form').style.display = 'none';
    document.getElementById('chat-messages').style.display = 'none';
    document.getElementById('chatbot-footer').style.display = 'none';
    document.getElementById('chat-messages').innerHTML = '';
    document.getElementById('chatbot-input').disabled = true;
    document.getElementById('chatbot-input').value = '';
    
    // If we have stored user info, populate the form
    if (currentUserInfo) {
        document.getElementById('user-first-name').value = currentUserInfo.firstName;
        document.getElementById('user-last-name').value = currentUserInfo.lastName;
        document.getElementById('user-phone').value = currentUserInfo.userPhone;
        document.getElementById('user-email').value = currentUserInfo.userEmail;
        const chatMessages = document.getElementById('chat-messages');
		sendMessage("Hi");
    //chatMessages.innerHTML = `
    //    <div class="message bot-message">How can I assist you today?</div>
    //`;
    }
}

async function closeChatbot() {
    const chatbotWindow = document.getElementById('chatbot-window');
    const chatbotIcon = document.getElementById('chatbot-icon');
    const overlay = document.getElementById('chatbot-overlay');


    // Only make the API call if there was an active session
    if (currentSessionId) {
        try {
            const response = await fetch(`https://teleapi.datalytique.com:7755/api/chat/close`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    session_id: currentSessionId
                })
            });

            if (!response.ok) {
                console.error('Failed to close chat session');
            }
        } catch (error) {
            console.error('Error closing chat session:', error);
        }
    }

    chatbotWindow.style.display = 'none';
    overlay.style.display = 'none';
    chatbotIcon.style.width = '50px';
    chatbotIcon.style.height = '50px';
    
    resetChat();
}

async function initiateCall() {
    if (currentUserInfo && currentUserInfo.userPhone) {
        const requestBody = {
        user_id: user_id, 
        topic_id: topic_id,
        first_name: currentUserInfo?.firstName || '',
        last_name: currentUserInfo?.lastName || '',
        phone_number: currentUserInfo?.userPhone || '',
        email: currentUserInfo?.userEmail || '',
        topic_name: "PCS VOIP",
        description:"PCS VOIP"
    };

    try {
        const response = await fetch('https://teleapi.datalytique.com:7755/calls/single', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
        });
        if (!response.ok) {
                console.error('Failed to close chat session');
            }
        
    } catch (error) {
        console.error('Error sending message:', error);
    }
    console.log('Initiating call with:', currentUserInfo.userPhone);
        
    } else {
        alert('Please provide your information first to initiate a call.');
    }
}

async function loadTopic() {
    try {
        const response = await fetch(`https://teleapi.datalytique.com:9001/api/chattelebot/persona/${chat_id}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        if (!response.ok) {
            throw new Error('Failed to load topic');
        }

        const data = await response.json();
        topic_id = data; // Set the global topic_id variable
        console.log('Topic ID loaded:', topic_id);
    } catch (error) {
        console.error('Error loading topic:', error);
    }
}
</script>
</body>
