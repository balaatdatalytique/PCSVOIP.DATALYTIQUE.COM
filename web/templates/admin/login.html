{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PCS VoIP Admin</title>
<link rel="icon" type="image/png" href="/assets/img/favicon-pcs.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/web/static/admin/admin.css">
</head>
<body class="admin-login-body">
<div class="admin-login-card">
  <div class="admin-login-brand">
    <img src="/assets/img/favicon-pcs.png" alt="PCS VoIP">
    <div>
      <strong>PCS VoIP</strong>
      <span>Administration</span>
    </div>
  </div>
  {{if .Error}}<div class="admin-alert">{{.Error}}</div>{{end}}
  <form method="POST" action="/admin/login" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
{{end}}
