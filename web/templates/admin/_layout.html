{{define "_layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · PCS VoIP Admin</title>
<link rel="icon" type="image/png" href="/assets/img/favicon-pcs.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/web/static/admin/admin.css">
<meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="/assets/img/favicon-pcs.png" alt="PCS"> <span>PCS VoIP <em>Admin</em></span>
    </div>
    <nav class="admin-nav">
      <a href="/admin/dashboard" class="{{if eq .NavActive "dashboard"}}active{{end}}"><i class="fas fa-gauge"></i><span>Overview</span></a>
      <a href="/admin/bot" class="{{if eq .NavActive "bot"}}active{{end}}"><i class="fas fa-robot"></i><span>Bot Control</span></a>
      <a href="/admin/kb" class="{{if eq .NavActive "kb"}}active{{end}}"><i class="fas fa-book"></i><span>Knowledge Base</span></a>
      <a href="/admin/visitors" class="{{if eq .NavActive "visitors"}}active{{end}}"><i class="fas fa-chart-line"></i><span>Visitors</span></a>
      <a href="/admin/settings" class="{{if eq .NavActive "settings"}}active{{end}}"><i class="fas fa-cog"></i><span>Settings</span></a>
      <a href="/admin/files" class="{{if eq .NavActive "files"}}active{{end}}"><i class="fas fa-folder-tree"></i><span>Site Files</span></a>
    </nav>
    <form method="POST" action="/admin/logout" class="admin-logout">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <button type="submit"><i class="fas fa-right-from-bracket"></i><span>Sign out</span></button>
    </form>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar">
      <h1>{{.Title}}</h1>
      <div class="topbar-meta"><i class="fas fa-user-shield"></i> admin</div>
    </header>
    <section class="admin-content">
      {{template "page" .}}
    </section>
  </main>
</div>
<!-- Toast container -->
<div id="pcs-toast-wrap" aria-live="polite"></div>
<script src="/web/static/admin/admin.js" defer></script>
</body>
</html>
{{end}}
