{{define "page"}}
<div class="card admin-card p-4">
  {{if .IsNew}}
    <form method="POST" action="/admin/kb" enctype="multipart/form-data">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" name="title" placeholder="Auto-filled from filename if empty" value="{{.Doc.Title}}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Tags <span class="text-muted small">(comma separated)</span></label>
          <input type="text" class="form-control" name="tags" placeholder="pricing, products">
        </div>
      </div>
      <div class="mt-3">
        <label class="form-label">Upload a file <span class="text-muted small">(.txt, .md, .csv, .pdf, .docx)</span></label>
        <input type="file" class="form-control" name="file" accept=".txt,.md,.csv,.pdf,.docx">
      </div>
      <div class="text-center text-muted my-3">— or —</div>
      <div class="mb-3">
        <label class="form-label">Paste content directly</label>
        <textarea class="form-control mono" name="content" rows="12" placeholder="Paste any text the bots should know about your business..."></textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="active" name="active" checked>
        <label class="form-check-label" for="active">Active (include in bot context)</label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Save</button>
        <a href="/admin/kb" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  {{else}}
    <form method="POST" action="/admin/kb/update">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <input type="hidden" name="id" value="{{.Doc.ID}}">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" name="title" value="{{.Doc.Title}}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tags</label>
          <input type="text" class="form-control" name="tags" value="{{join ", " .Doc.Tags}}">
        </div>
      </div>
      <div class="my-3 text-muted small">
        Source: <strong>{{.Doc.Source}}</strong>{{if .Doc.SourceName}} · {{.Doc.SourceName}}{{end}} · {{fmtBytes .Doc.Bytes}} · created {{fmtTime .Doc.CreatedAt}}
      </div>
      <div class="mb-3">
        <label class="form-label">Content</label>
        <textarea class="form-control mono" name="content" rows="20">{{.Doc.Content}}</textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="active" name="active" {{if .Doc.Active}}checked{{end}}>
        <label class="form-check-label" for="active">Active (include in bot context)</label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Save changes</button>
        <a href="/admin/kb" class="btn btn-outline-secondary">Back</a>
      </div>
    </form>
  {{end}}
</div>
{{end}}
