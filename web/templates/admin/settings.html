{{define "page"}}
{{if .Saved}}<div class="admin-flash success">Settings saved.</div>{{end}}
<ul class="nav nav-tabs admin-tabs">
  <li class="nav-item"><a class="nav-link {{if eq .Tab "ai"}}active{{end}}" href="?tab=ai"><i class="fas fa-brain me-1"></i> AI Providers</a></li>
  <li class="nav-item"><a class="nav-link {{if eq .Tab "email"}}active{{end}}" href="?tab=email"><i class="fas fa-envelope me-1"></i> Email</a></li>
  <li class="nav-item"><a class="nav-link {{if eq .Tab "general"}}active{{end}}" href="?tab=general"><i class="fas fa-globe me-1"></i> General</a></li>
</ul>

<form method="POST" action="/admin/settings" class="card admin-card p-4 settings-form">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  <input type="hidden" name="tab" value="{{.Tab}}">

  {{if eq .Tab "ai"}}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Active provider</label>
        <select class="form-select" name="ai_provider">
          <option value="grok" {{if eq .Settings.AIProvider "grok"}}selected{{end}}>Grok (xAI)</option>
          <option value="openai" {{if eq .Settings.AIProvider "openai"}}selected{{end}}>OpenAI</option>
          <option value="anthropic" {{if eq .Settings.AIProvider "anthropic"}}selected{{end}}>Anthropic</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Model override <span class="text-muted small">(optional)</span></label>
        <input type="text" class="form-control" name="ai_model" value="{{.Settings.AIModel}}" placeholder="grok-3-mini-fast">
      </div>
    </div>
    <hr>
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">Grok API key {{if not .Settings.GrokAPIKey.IsEmpty}}<span class="badge bg-success">set</span>{{end}}</label>
        <input type="password" class="form-control" name="grok_api_key" placeholder="{{if .Settings.GrokAPIKey.IsEmpty}}xai-...{{else}}leave blank to keep current{{end}}">
      </div>
      <div class="col-md-12">
        <label class="form-label">OpenAI API key {{if not .Settings.OpenAIAPIKey.IsEmpty}}<span class="badge bg-success">set</span>{{end}}</label>
        <input type="password" class="form-control" name="openai_api_key" placeholder="{{if .Settings.OpenAIAPIKey.IsEmpty}}sk-...{{else}}leave blank to keep current{{end}}">
      </div>
      <div class="col-md-12">
        <label class="form-label">Anthropic API key {{if not .Settings.AnthropicAPIKey.IsEmpty}}<span class="badge bg-success">set</span>{{end}}</label>
        <input type="password" class="form-control" name="anthropic_api_key" placeholder="{{if .Settings.AnthropicAPIKey.IsEmpty}}sk-ant-...{{else}}leave blank to keep current{{end}}">
      </div>
    </div>
  {{end}}

  {{if eq .Tab "email"}}
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">SMTP host</label>
        <input type="text" class="form-control" name="smtp_host" value="{{.Settings.SMTPHost}}" placeholder="smtp.gmail.com">
      </div>
      <div class="col-md-4">
        <label class="form-label">Port</label>
        <input type="number" class="form-control" name="smtp_port" value="{{.Settings.SMTPPort}}" placeholder="587">
      </div>
      <div class="col-md-6">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="smtp_user" value="{{.Settings.SMTPUser}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Password {{if not .Settings.SMTPPass.IsEmpty}}<span class="badge bg-success">set</span>{{end}}</label>
        <input type="password" class="form-control" name="smtp_pass" placeholder="{{if .Settings.SMTPPass.IsEmpty}}••••{{else}}leave blank to keep current{{end}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">From email</label>
        <input type="email" class="form-control" name="smtp_from_email" value="{{.Settings.SMTPFromEmail}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">From name</label>
        <input type="text" class="form-control" name="smtp_from_name" value="{{.Settings.SMTPFromName}}">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="smtp_use_tls" name="smtp_use_tls" {{if .Settings.SMTPUseTLS}}checked{{end}}>
          <label class="form-check-label" for="smtp_use_tls">Use TLS</label>
        </div>
      </div>
    </div>
    <hr>
    <button type="button" id="testSmtpBtn" class="btn btn-outline-primary btn-sm"><i class="fas fa-vial me-1"></i> Send test email</button>
    <span id="smtpTestResult" class="ms-2 small"></span>
  {{end}}

  {{if eq .Tab "general"}}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Admin email</label>
        <input type="email" class="form-control" name="admin_email" value="{{.Settings.AdminEmail}}" placeholder="admin@example.com">
      </div>
      <div class="col-md-6">
        <label class="form-label">Site URL</label>
        <input type="url" class="form-control" name="site_url" value="{{.Settings.SiteURL}}" placeholder="https://pcsvoip.datalytique.com">
      </div>
    </div>
  {{end}}

  <div class="mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Save settings</button>
    <span class="text-muted small ms-2 align-self-center">Last updated {{fmtTime .Settings.UpdatedAt}}</span>
  </div>
</form>
{{end}}
