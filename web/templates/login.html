<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border: 1px solid #e0e0e0; }
        h1 { text-align: center; margin-bottom: 30px; color: #333; font-size: 24px; }
        h1 span { color: #007acc; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #d0d0d0; border-radius: 6px; background: #ffffff; color: #333; font-size: 16px; }
        input:focus { outline: none; border-color: #007acc; box-shadow: 0 0 0 1px #007acc; }
        button { width: 100%; padding: 12px; background: #007acc; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { background: #005fa3; }
        .error { background: #d73a49; color: white; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>PCS<span>VoIP</span> CMS</h1>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
