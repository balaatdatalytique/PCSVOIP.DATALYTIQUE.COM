<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>PCSVoIP | Elite Login</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/login/css/bootstrap.min.css">
    <!-- Fontawesome CSS -->
    <link rel="stylesheet" href="assets/login/css/fontawesome-all.min.css">
    <!-- Flaticon CSS -->
    <link rel="stylesheet" href="assets/login/font/flaticon.css">
    <!-- Google Web Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&amp;display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/login/style.css">
	<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }
        iframe {
            width: 100%;
            height: 80vh;
            border: none;
        }
    </style>
    <link rel="stylesheet" href="assets/css/chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

    <section class="fxt-template-animation fxt-template-layout3" data-bg-image="assets/login/img/figure/bg1.jpg">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 col-12 fxt-none-991">
                    <div class="fxt-header">
                        <div class="fxt-transformY-50 fxt-transition-delay-1">
                            <a href="javascript:void(0);" class="fxt-logo"><img src="assets/login/img/logo.png" alt="Logo"></a>
                        </div>


                    </div>
                </div>
                <div class="col-lg-6 col-12 fxt-bg-color">
                    <div class="fxt-content">
                        <div class="fxt-form">
                            <h2>Login</h2>
                            <form method="POST">
                                <div class="form-group">
    <input type="text" id="username" class="form-control" name="username" placeholder="Username" required="required">
</div>
                                <div class="form-group">

                                    <input id="password" type="password" class="form-control" name="password" placeholder="Password" required="required">
                                    <i toggle="#password" class="fa fa-fw fa-eye toggle-password field-icon"></i>
                                </div>
                                <div class="form-group">
                                    <div class="fxt-checkbox-area">
                                        <div class="checkbox">
                                            <input id="checkbox1" type="checkbox">
                                            <label for="checkbox1">Keep me logged in</label>
                                        </div>
                                        <a href="forgot-password-3.html" class="switcher-text">Forgot Password</a>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <button type="submit" class="fxt-btn-fill">Log in</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- jquery-->
    <script src="assets/login/js/jquery.min.js"></script>
    <!-- Bootstrap js -->
    <script src="assets/login/js/bootstrap.min.js"></script>
    <!-- Imagesloaded js -->
    <script src="assets/login/js/imagesloaded.pkgd.min.js"></script>
    <!-- Validator js -->
    <script src="assets/login/js/validator.min.js"></script>
    <!-- Custom Js -->
    <script src="assets/login/js/main.js"></script>
		         <div id="chatbot-icon" onclick="toggleChatbot()">
        <i class="fas fa-comments"></i>
    </div>

    <!-- Add overlay div -->
    <div class="chatbot-overlay" id="chatbot-overlay"></div>

    <!-- Chatbot Window -->
    <div id="chatbot-window">
        <div id="chatbot-header">
            <span>Pegasi</span>
            <div class="header-buttons">
                <button class="header-btn phone-btn" onclick="initiateCall()">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="close-btn" onclick="closeChatbot()">End Chat</button>
            </div>
        </div>
        <div id="chatbot-body">
            <div id="chat-messages"></div>
            <div id="user-form" class="user-form">
                <input type="text" id="user-first-name" placeholder="First Name *" required>
                <input type="text" id="user-last-name" placeholder="Last Name *" required>
                <input type="tel" id="user-phone" placeholder="Phone Number *" required>
                <input type="email" id="user-email" placeholder="Email (optional)">
                <button onclick="startChat()">Start Chat</button>
            </div>
        </div>
                <div id="voice-mode">
            <div class="voice-orb" onclick="startVoiceSession()"><i class="fas fa-microphone"></i></div>
            <div class="voice-status" id="voice-status">Click to start</div>
            <div class="voice-transcript" id="voice-transcript"></div>
            <button class="voice-end-btn" onclick="endVoiceSession()">End Voice Chat</button>
        </div>
        <div id="chatbot-footer">
            <input type="text" id="chatbot-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="submitChatMessage()" title="Send"><i class="fas fa-paper-plane"></i></button>
            <button id="voice-start-btn" onclick="startVoiceSession()" title="Talk to Pegasi"><i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <script src="assets/js/chatbot.js"></script>
</body>

</html>
