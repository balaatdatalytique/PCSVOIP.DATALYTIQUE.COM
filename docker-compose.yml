# ─── pcsvoip.datalytique.com ────────────────────────────────────────────
# DEPENDENCY: smartcrm.pcsvoip.com must be started FIRST so the
# "smartcrmpcsvoipcom_default" network exists. That project's nginx-proxy
# handles SSL termination and routes:
#   /              → pcsvoip-web:9080   (website + admin)
#   /ws/voice      → pcsvoip-voice:9081 (voice chat WebSocket)
#   /api/chat      → pcsvoip-voice:9081 (text chat API)
# Nginx config:  /home/production/DEPLOYED/smartcrm.pcsvoip.com/nginx.conf
# ────────────────────────────────────────────────────────────────────────

services:
  pcsvoip-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcsvoip-web
    restart: unless-stopped
    ports:
      - "9080:9080"
    env_file:
      - .env
    environment:
      - ADMIN_DB_PATH=/app/data/admin.db
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - VOICE_PROXY_URL=http://pcsvoip-voice:9081
      - BOT_CONTEXT_FILE=/app/assets/data/pcsvoip-context.txt
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL:-}
    volumes:
      - cms-backups:/app/.cms-backups
      - admin-data:/app/data
      - ./assets/videos:/app/assets/videos:ro
      - ./assets/apivideos:/app/assets/apivideos:ro
    networks:
      - default
      - nginx-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  voice-proxy:
    build:
      context: ./voice-proxy
      dockerfile: Dockerfile
    container_name: pcsvoip-voice
    restart: unless-stopped
    ports:
      - "9081:9081"
    networks:
      - default
      - nginx-proxy
    environment:
      - GROK_API_KEY=${GROK_API_KEY}
      - VOICE_PROXY_PORT=9081
      - CONTEXT_PATH=/app/assets/data/pcsvoip-context.txt
      - BOT_CONTEXT_URL=http://pcsvoip-web:9080/api/bot/context
      - VISITOR_LOG_URL=http://pcsvoip-web:9080/api/visitors/log
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - FREESWITCH_HOST=${FREESWITCH_HOST:-host.docker.internal}
      - FREESWITCH_ESL_PORT=${FREESWITCH_ESL_PORT:-8021}
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-}
      - FREESWITCH_GATEWAY=${FREESWITCH_GATEWAY:-twilio}
      - CALLBACK_CALLER_ID=${CALLBACK_CALLER_ID:-+18447278647}
      - AUDIO_FORK_WS_URL=${AUDIO_FORK_WS_URL:-ws://pcsvoip-voice:9081/ws/audiofork}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets/data:/app/assets/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  nginx-proxy:
    external: true
    name: smartcrmpcsvoipcom_default

volumes:
  cms-backups:
  admin-data:
