services:
  pcsvoip-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcsvoip-web
    restart: unless-stopped
    ports:
      - "9080:9080"
    env_file:
      - .env
    environment:
      - ADMIN_DB_PATH=/app/data/admin.db
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - VOICE_PROXY_URL=http://pcsvoip-voice:9081
      - BOT_CONTEXT_FILE=/app/assets/data/pcsvoip-context.txt
    volumes:
      - cms-backups:/app/.cms-backups
      - admin-data:/app/data
      - ./assets/videos:/app/assets/videos:ro
      - ./assets/apivideos:/app/assets/apivideos:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  voice-proxy:
    build:
      context: ./voice-proxy
      dockerfile: Dockerfile
    container_name: pcsvoip-voice
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      - GROK_API_KEY=${GROK_API_KEY}
      - VOICE_PROXY_PORT=9081
      - CONTEXT_PATH=/app/assets/data/pcsvoip-context.txt
      - BOT_CONTEXT_URL=http://pcsvoip-web:9080/api/bot/context
      - VISITOR_LOG_URL=http://pcsvoip-web:9080/api/visitors/log
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
    volumes:
      - ./assets/data:/app/assets/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cms-backups:
  admin-data:
